name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers when a new version tag (e.g. v1.1.1) is pushed
  workflow_dispatch: # Allows manual triggers from the GitHub UI

jobs:
  release:
    name: Compile and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create/update releases and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease

      - name: Build Release App Bundle (AAB)
        run: ./gradlew bundleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/**/*.apk
            app/build/outputs/bundle/release/**/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
